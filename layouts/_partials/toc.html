{{- if strings.Contains .TableOfContents "<li>" -}}
  {{- $class := .Class | default "page" -}}
  {{- $open := not (.Collapsed | default false) -}}
  <details class="table-of-content {{ $class }}"{{ if $open }} open{{ end }}>
    <summary>
      <span>{{ i18n "toc" | default "Table of Contents" }}</span>
      <span class="toc-toggle" aria-hidden="true"></span>
    </summary>
    {{ .TableOfContents }}
  </details>
{{- end -}}
